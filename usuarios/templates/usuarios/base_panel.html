<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Propietario</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/panel_propietario.css' %}">
</head>
<body>

<!-- ── NAVBAR ── -->
<nav>
    <a href="{% url 'usuarios:dashboard' %}" class="nav-brand">
        🐾 Little<span>Pets</span>
    </a>
    <span class="nav-page-title">Panel del Propietario</span>
    <div style="display:flex; align-items:center; gap:.75rem;">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú">☰</button>
        <a href="{% url 'usuarios:logout' %}" class="btn-verde">Cerrar sesión</a>
    </div>
</nav>

<!-- ── LAYOUT ── -->
<div class="layout">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">

        <!-- Dashboard directo -->
        <a href="{% url 'usuarios:dashboard' %}" class="sidebar-home {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <span class="icon">🏠</span> Dashboard
        </a>

        <div class="sidebar-sep"></div>

        <!-- Sección: Mi Perfil -->
        <div class="acc-section sec-usuarios">
            <button class="acc-btn" onclick="toggleAcc(this)" aria-expanded="false">
                <span class="acc-dot dot-usuarios"></span>
                <span class="acc-label">Mi Cuenta</span>
                <span class="acc-arrow">▼</span>
            </button>
            <div class="acc-panel">
                <div class="acc-inner">
                    <a href="{% url 'usuarios:perfil' %}" class="sidebar-link {% if request.resolver_match.url_name == 'perfil' %}active{% endif %}">
                        <span class="icon">👤</span> Mi Perfil
                    </a>

                    <a href="{% url 'usuarios:contraseña' %}" class="sidebar-link {% if request.resolver_match.url_name == 'perfil' %}active{% endif %}">
                        <span class="icon">🔒</span> Cambiar Contraseña
                    </a>
                </div>
            </div>
        </div>

        <!-- Sección: Mascotas -->
        <div class="acc-section sec-mascotas">
            <button class="acc-btn" onclick="toggleAcc(this)" aria-expanded="false">
                <span class="acc-dot dot-mascotas"></span>
                <span class="acc-label">Mis Mascotas</span>
                <span class="acc-arrow">▼</span>
            </button>
            <div class="acc-panel">
                <div class="acc-inner">
                    <a href="{% url 'usuarios:mascotas' %}" class="sidebar-link {% if request.resolver_match.url_name == 'mascotas' %}active{% endif %}">
                        <span class="icon">🐾</span> Ver Mascotas
                    </a>
                    

                </div>
            </div>
        </div>

        <!-- Sección: Citas -->
        <div class="acc-section sec-citas">
            <button class="acc-btn" onclick="toggleAcc(this)" aria-expanded="false">
                <span class="acc-dot dot-citas"></span>
                <span class="acc-label">Mis Citas</span>
                <span class="acc-arrow">▼</span>
            </button>
            <div class="acc-panel">
                <div class="acc-inner">
                    <a href="{% url 'citas:listar' %}" class="sidebar-link {% if request.resolver_match.url_name == 'listar' %}active{% endif %}">
                        <span class="icon">📅</span> Ver Citas
                    </a>
                </div>
            </div>
        </div>


        <div class="acc-section sec-factura">
    <button class="acc-btn" onclick="toggleAcc(this)" aria-expanded="false">
        <span class="acc-dot dot-factura"></span>
        <span class="acc-label">Vacunación</span>
        <span class="acc-arrow">▼</span>
    </button>
    <div class="acc-panel">
        <div class="acc-inner">

            <a href="{% url 'citas:vacunas_agendadas' %}" class="sidebar-link">
    <span class="icon">🧾</span> Ver Vacunas
</a>

        </div>
    </div>
</div>

        <!-- Sección: Historial -->
<div class="acc-section sec-factura">
    <button class="acc-btn" onclick="toggleAcc(this)" aria-expanded="false">
        <span class="acc-dot dot-factura"></span>
        <span class="acc-label">Mis Facturas</span>
        <span class="acc-arrow">▼</span>
    </button>
    <div class="acc-panel">
        <div class="acc-inner">

            <a href="{% url 'facturacion:lista_facturas' %}" class="sidebar-link">
    <span class="icon">🧾</span> Ver Facturas
</a>

        </div>
    </div>
</div>

    </aside>

    <!-- ── CONTENIDO ── -->
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

</div>

<!-- ── FOOTER ── -->
<footer>
    Little Pets &copy; 2026 · Hecho con <span>♥</span> para tus mascotas
</footer>

<!-- Overlay para mobile -->
<div id="sidebarOverlay" onclick="closeSidebar()"
     style="display:none; position:fixed; inset:0; top:0;
            background:rgba(0,0,0,.35); z-index:150;
            backdrop-filter:blur(2px);"></div>

<script>
    /* ── Acordeón ── */
    function toggleAcc(btn) {
        const panel = btn.nextElementSibling;
        const isOpen = btn.classList.contains('open');
        btn.classList.toggle('open', !isOpen);
        panel.classList.toggle('open', !isOpen);
        btn.setAttribute('aria-expanded', String(!isOpen));
    }

    /* Abrir automáticamente la sección activa al cargar */
    document.querySelectorAll('.sidebar-link.active').forEach(link => {
        const panel = link.closest('.acc-panel');
        const btn   = panel?.previousElementSibling;
        if (panel && btn) {
            panel.classList.add('open');
            btn.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');
        }
    });

    /* ── Toggle mobile ── */
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    document.getElementById('sidebarToggle').addEventListener('click', () => {
        const open = sidebar.classList.toggle('open');
        overlay.style.display = open ? 'block' : 'none';
    });

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.style.display = 'none';
    }
</script>

</body>
</html>
