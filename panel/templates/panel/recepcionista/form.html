{% extends "base.html" %}
{% block content %}

<div class="form-card">

  <div class="page-title">
    {% if object %}Editar Recepcionista{% else %}Nuevo Recepcionista{% endif %}
  </div>

  <form method="post">
    {% csrf_token %}

    {% for field in form %}
    <div class="form-group">

      <label>{{ field.label }}</label>
      {{ field }}

      {% if field.errors %}
      <small style="color:red">
        {{ field.errors|join:", " }}
      </small>
      {% endif %}

    </div>
    {% endfor %}

    <div class="form-actions">
      <button class="btn-verde" type="submit">
        Guardar
      </button>

      <a class="btn-marron"
         href="{% url 'panel:panel_recepcionista_list' %}">
        Cancelar
      </a>
    </div>

  </form>

</div>

{% endblock %}
