{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div>
    <div class="page-title">
      {% if form.instance.pk %}Editar Categoría{% else %}Nueva Categoría{% endif %}
    </div>
    <div class="page-sub">Formulario de categoría</div>
  </div>
</div>

<div class="form-container">

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label>{{ form.nombre_categoria.label }}</label>
      {{ form.nombre_categoria }}
    </div>

    <button type="submit" class="btn-verde">Guardar</button>
    <a href="{% url 'panel:panel_categoriaservicio_list' %}" class="btn-sm">Cancelar</a>

  </form>

</div>

{% endblock %}
