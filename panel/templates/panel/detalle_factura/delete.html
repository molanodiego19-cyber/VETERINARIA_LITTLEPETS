{% extends 'usuarios/base_veterinario.html' %}
{% block content %}

<div class="confirm-card">
  <div class="confirm-icon">🐾</div>
  <div class="page-title">¿Eliminar detalle?</div>

  <p>
    Esta acción eliminará el detalle 
    <strong>{{ object }}</strong>. No se puede deshacer.
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn-marron">Sí, eliminar</button>
      <a class="btn-verde" href="{% url 'panel:panel_detallefactura_list' %}">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
