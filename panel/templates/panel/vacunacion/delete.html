{% extends "base.html" %}
{% block content %}

<div class="confirm-card">
  <div class="confirm-icon">💉</div>
  <div class="page-title">¿Eliminar vacunación?</div>

  <p>
    Esta acción eliminará el registro de 
    <strong>{{ object.mascota }}</strong>. No se puede deshacer.
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn-marron">Sí, eliminar</button>
      <a class="btn-verde" href="{% url 'panel:panel_vacunacion_list' %}">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
